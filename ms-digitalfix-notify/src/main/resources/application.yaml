server:
  port: 8084

spring:
  application:
    name: ms-digitalfix-notify
  rabbitmq:
    host: ${RABBIT_HOST:localhost}
    port: ${RABBIT_PORT:5672}
    username: ${RABBIT_USER:digitalfix}
    password: ${RABBIT_PASS:digitalfix}
    listener:
      simple:
        acknowledge-mode: manual        # el ACK lo hacemos nosotros en el código
        default-requeue-rejected: false # un mensaje rechazado no vuelve a la cola, se va a la DLQ
        prefetch: 1                     # lee de a un mensaje a la vez

# Nombres de la topología RabbitMQ. Todo se lee de acá, no hay nombres sueltos en el código.
digitalfix:
  rabbit:
    exchanges:
      direct: cmd.direct
      topic: cmd.topic
      dead: cmd.dead.dlx
    queues:
      email:
        name: q.cmd.email
        dlq: q.cmd.email.dlq
        direct-key: email.send
        topic-key: "email.*"
        dlq-key: email.dlq
      dispatch:
        name: q.cmd.dispatch
        dlq: q.cmd.dispatch.dlq
        direct-key: dispatch.ticket
        topic-key: "dispatch.#"
        dlq-key: dispatch.dlq
      report:
        name: q.cmd.report
        dlq: q.cmd.report.dlq
        direct-key: report.gen
        topic-key: "report.*"
        dlq-key: report.dlq
  consumer:
    retry:
      max-attempts: 3   # cuántas veces se intenta un error temporal
      backoff-ms: 2000  # espera entre intentos
  kafka:
    # Local: los 3 brokers por sus puertos externos. En Docker se cambia con KAFKA_BOOTSTRAP_SERVERS.
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092,localhost:9093,localhost:9094}
    audit-topic: audit.events
    # Parámetros de administración de tópicos ajustados a cada flujo de datos (Criterio 7 EP5)
    topics:
      workorders:
        name: workorders.events
        partitions: 3
        replicas: 3
        min-insync-replicas: 2
        cleanup-policy: delete
        retention-ms: 604800000    # 7 días (eventos operativos de órdenes para analítica)
      audit:
        name: audit.events
        partitions: 3
        replicas: 3
        min-insync-replicas: 2
        cleanup-policy: delete
        retention-ms: 2592000000   # 30 días (trazabilidad e historial inmutable de auditoría)
      dlt:
        partitions: 3
        replicas: 3
        min-insync-replicas: 2
        cleanup-policy: delete
        retention-ms: 1209600000   # 14 días (Dead Letter Topics para inspección de fallos)