# ==============================================================================
# RabbitMQ Cluster Configuration - DigitalFix
# ==============================================================================

# Permitir conexiones de usuarios administrativos
loopback_users.guest = false

# Puertos estándar AMQP y Management
listeners.tcp.default = 5672
management.tcp.port = 15672

# Credenciales por defecto
default_user = digitalfix
default_pass = digitalfix
default_vhost = /

# ------------------------------------------------------------------------------
# Clustering: Classic Peer Discovery
# Define los nodos que conforman el clúster. Al iniciar, los nodos buscan a sus
# pares y se sincronizan automáticamente usando el mismo RABBITMQ_ERLANG_COOKIE.
# ------------------------------------------------------------------------------
cluster_formation.peer_discovery_backend = classic_config
cluster_formation.classic_config.nodes.1 = rabbit@rabbitmq
cluster_formation.classic_config.nodes.2 = rabbit@rabbitmq2
