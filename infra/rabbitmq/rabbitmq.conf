# ==============================================================================
# Configuración del Clúster RabbitMQ (2 nodos) - DigitalFix
# Este archivo se monta como solo lectura (:ro) en rabbitmq y rabbitmq2.
# ==============================================================================

# Permite iniciar sesión desde fuera del contenedor (para el panel web 15672/15673)
loopback_users.guest = false

# Puerto AMQP para los microservicios (5672) y puerto de la consola web (15672)
listeners.tcp.default = 5672
management.tcp.port = 15672

# Usuario, contraseña y virtual host que usan workorders y notify
default_user = digitalfix
default_pass = digitalfix
default_vhost = /

# ------------------------------------------------------------------------------
# Armado automático del clúster (Classic Peer Discovery)
# Al arrancar, rabbitmq y rabbitmq2 se buscan por nombre de contenedor en la red Docker
# y se unen al mismo clúster porque comparten la misma RABBITMQ_ERLANG_COOKIE.
# ------------------------------------------------------------------------------
cluster_formation.peer_discovery_backend = classic_config
cluster_formation.classic_config.nodes.1 = rabbit@rabbitmq
cluster_formation.classic_config.nodes.2 = rabbit@rabbitmq2
