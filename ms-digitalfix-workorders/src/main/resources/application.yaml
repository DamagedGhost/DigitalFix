spring:
  application:
    name: ms-digitalfix-workorders
  datasource:
    url: jdbc:postgresql://localhost:5432/digitalfix
    username: digitalfix
    password: digitalfix
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  flyway:
    enabled: true
    locations: classpath:db/migration
  rabbitmq:
    host: ${RABBIT_HOST:localhost}
    port: ${RABBIT_PORT:5672}
    username: ${RABBIT_USER:digitalfix}
    password: ${RABBIT_PASS:digitalfix}

server:
  port: 8081

# Nombres que usa el producer para mandar mensajes. Todo se lee de acá, no hay nombres sueltos en el código.
digitalfix:
  rabbit:
    exchange: cmd.direct
    routing-keys:
      email: email.send
      dispatch: dispatch.ticket
      report: report.gen