spring:
  application:
    name: ms-digitalfix-workorders
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/digitalfixdb}
    username: ${SPRING_DATASOURCE_USERNAME:tu_usuario}
    password: ${SPRING_DATASOURCE_PASSWORD:tu_password}
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  flyway:
    enabled: true
    locations: classpath:db/migration
  rabbitmq:
    host: ${SPRING_RABBITMQ_HOST:${RABBIT_HOST:localhost}}
    port: ${SPRING_RABBITMQ_PORT:${RABBIT_PORT:5672}}
    username: ${SPRING_RABBITMQ_USERNAME:${RABBIT_USER:digitalfix}}
    password: ${SPRING_RABBITMQ_PASSWORD:${RABBIT_PASS:digitalfix}}

server:
  port: 8081

# Nombres que usa el producer para mandar mensajes. Todo se lee de acá, no hay nombres sueltos en el código.
digitalfix:
  rabbit:
    exchange: cmd.direct
    routing-keys:
      email: email.send
      dispatch: dispatch.ticket
      report: report.gen
