services:

  # ---------- Inicializacion BFF intermediario ----------
  bff:
    build: ./ms-digitalfix-bff
    container_name: bff-app
    restart: always
    env_file:
      - .env
    ports:
      - "8080:8080"
    environment:
      - WORKORDERS_BASE_URL=http://workorders:8081
      - CATALOG_BASE_URL=http://catalog:8083
      - NOTIFY_BASE_URL=http://notify:8084
      - AUDIT_BASE_URL=http://audit:8085
      - REPORT_BASE_URL=http://report:8086
    depends_on:
      - workorders
      - catalog
      - notify
      - audit    # NUEVO
      - report   # NUEVO

  # ---------- Inicializacion Frontend ----------
  frontend:
    build:
      context: .
      dockerfile: frontend-digitalfix/dockerfile
    container_name: front-app
    restart: always
    ports:
      - "80:80"
    depends_on:
      - bff

  # ---------- Inicializacion microservicios: workorders ----------
  workorders:
    build: ./ms-digitalfix-workorders
    container_name: workorders-app
    restart: always
    env_file:
      - .env
    expose:
      - "8081"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres-db:5432/digitalfixdb
      - SPRING_DATASOURCE_USERNAME=tu_usuario
      - SPRING_DATASOURCE_PASSWORD=tu_password
      - SPRING_RABBITMQ_HOST=rabbitmq
      - SPRING_RABBITMQ_PORT=5672
      - SPRING_RABBITMQ_USERNAME=digitalfix
      - SPRING_RABBITMQ_PASSWORD=digitalfix
      - KAFKA_BOOTSTRAP_SERVERS=kafka1:29092,kafka2:29092,kafka3:29092   # NUEVO
    depends_on:
      postgres-db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  # ---------- Inicializacion microservicios: catalog ----------
  catalog:
    build: ./ms-digitalfix-catalog
    container_name: catalog-app
    restart: always
    env_file:
      - .env
    expose:
      - "8083"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres-db:5432/digitalfixdb
      - SPRING_DATASOURCE_USERNAME=tu_usuario
      - SPRING_DATASOURCE_PASSWORD=tu_password
    depends_on:
      postgres-db:
        condition: service_healthy

  # ---------- Inicializacion microservicios: notify ----------
  notify:
    build: ./ms-digitalfix-notify
    container_name: notify-app
    restart: always
    env_file:
      - .env
    expose:
      - "8084"
    environment:
      - RABBIT_HOST=rabbitmq
      - RABBIT_PORT=5672
      - RABBIT_USER=digitalfix
      - RABBIT_PASS=digitalfix
      - KAFKA_BOOTSTRAP_SERVERS=kafka1:29092,kafka2:29092,kafka3:29092   # NUEVO
    depends_on:
      rabbitmq:
        condition: service_healthy

  # ---------- NUEVO: consumidor de audit.events (auditoría)
  audit:
    build: ./ms-digitalfix-audit
    container_name: audit-app
    restart: always
    expose:
      - "8085"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres-db:5432/digitalfixdb
      - SPRING_DATASOURCE_USERNAME=tu_usuario
      - SPRING_DATASOURCE_PASSWORD=tu_password
      - KAFKA_BOOTSTRAP_SERVERS=kafka1:29092,kafka2:29092,kafka3:29092
      - JAVA_TOOL_OPTIONS=-Xms128m -Xmx256m
    depends_on:
      postgres-db:
        condition: service_healthy

  # ---------- NUEVO: consumidor de workorders.events (reportes en vivo)
  report:
    build: ./ms-digitalfix-report
    container_name: report-app
    restart: always
    expose:
      - "8086"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres-db:5432/digitalfixdb
      - SPRING_DATASOURCE_USERNAME=tu_usuario
      - SPRING_DATASOURCE_PASSWORD=tu_password
      - KAFKA_BOOTSTRAP_SERVERS=kafka1:29092,kafka2:29092,kafka3:29092
      - JAVA_TOOL_OPTIONS=-Xms128m -Xmx256m
    depends_on:
      postgres-db:
        condition: service_healthy

  # ---------- Inicializacion base de datos Postgres ----------
  postgres-db:
    image: postgres:15-alpine
    container_name: digitalfix-postgres
    restart: always
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_DB=digitalfixdb
      - POSTGRES_USER=tu_usuario
      - POSTGRES_PASSWORD=tu_password
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tu_usuario -d digitalfixdb"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ---------- Inicializacion cluster RabbitMQ (nodo 1)
  rabbitmq:
    image: rabbitmq:3-management
    container_name: digitalfix-rabbitmq
    hostname: rabbitmq
    restart: always
    environment:
      - RABBITMQ_DEFAULT_USER=digitalfix
      - RABBITMQ_DEFAULT_PASS=digitalfix
      - RABBITMQ_ERLANG_COOKIE=DIGITALFIX_CLUSTER_COOKIE_2026
    ports:
      - "5672:5672"     # AMQP para microservicios
      - "15672:15672"   # Panel Web de Gestión (Nodo 1)
    volumes:
      - ./infra/rabbitmq/rabbitmq.conf:/etc/rabbitmq/rabbitmq.conf:ro
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ---------- Inicializacion cluster RabbitMQ (2 nodos)
  rabbitmq2:
    image: rabbitmq:3-management
    container_name: digitalfix-rabbitmq2
    hostname: rabbitmq2
    restart: always
    environment:
      - RABBITMQ_ERLANG_COOKIE=DIGITALFIX_CLUSTER_COOKIE_2026
    ports:
      - "5673:5672"     # AMQP alternativo (Nodo 2)
      - "15673:15672"   # Panel Web de Gestión alternativo (Nodo 2)
    depends_on:
      rabbitmq:
        condition: service_healthy
    volumes:
      - ./infra/rabbitmq/rabbitmq.conf:/etc/rabbitmq/rabbitmq.conf:ro
      - rabbitmq2_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

# ---------- Definición de volúmenes para persistencia de datos ----------
volumes:
  pgdata:
  rabbitmq_data:
  rabbitmq2_data:

# ---------- NUEVO: red compartida con el cluster de Kafka (infra/kafka/docker-compose.kafka.yml)
networks:
  default:
    name: digitalfix-net
    external: true