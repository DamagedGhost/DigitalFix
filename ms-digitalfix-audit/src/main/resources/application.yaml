server:
  port: 8085

spring:
  application:
    name: ms-digitalfix-audit
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/digitalfixdb}
    username: ${SPRING_DATASOURCE_USERNAME:tu_usuario}
    password: ${SPRING_DATASOURCE_PASSWORD:tu_password}
  jpa:
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
    locations: classpath:db/migration
    # tabla de historial propia: la BBDD es compartida con workorders y catalog
    table: flyway_audit_history
    baseline-on-migrate: true
    baseline-version: 0

digitalfix:
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092,localhost:9093,localhost:9094}
    audit-topic: audit.events
    group-id: audit-group
    # Parámetros del tópico de auditoría (30 días de retención para trazabilidad inmutable)
    partitions: 3
    replicas: 3
    min-insync-replicas: 2
    cleanup-policy: delete
    retention-ms: 2592000000